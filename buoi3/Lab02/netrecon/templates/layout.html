<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetRecon – Network Reconnaissance Tool</title>
    <style>
        body { font-family: monospace; background: #1a1a2e; color: #eaeaea; margin: 0; padding: 20px; }
        h1 { color: #00d4ff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        form { background: #16213e; padding: 20px; border-radius: 8px; max-width: 600px; }
        label { display: block; margin-top: 12px; color: #a0a0c0; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; background: #0f3460;
                        border: 1px solid #334; color: #eaeaea; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 24px; background: #00d4ff; color: #000;
                 border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00a8cc; }
        pre { background: #0f3460; padding: 12px; border-radius: 4px; overflow-x: auto; }
        ul { background: #0f3460; padding: 12px 24px; border-radius: 4px; }
        h2 { color: #00d4ff; margin-top: 20px; }
        a { color: #00d4ff; }
    </style>
</head>
<body>
    <h1>NetRecon</h1>
    {% block content %}{% endblock %}
</body>
</html>
